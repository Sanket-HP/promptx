version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: promptx-postgres
    restart: always
    environment:
      POSTGRES_USER: promptx
      POSTGRES_PASSWORD: promptx_secret_pass
      POSTGRES_DB: promptx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: promptx-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: promptx-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://promptx:promptx_secret_pass@postgres:5432/promptx_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: promptx-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api

volumes:
  postgres_data:
